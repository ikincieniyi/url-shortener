spring:
  application:
    name: url-shortener
  mvc:
    problemdetails:
      enabled: true
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  base-url: http://localhost:8080
